server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # NB sicurezza: CSP, X-Content-Type-Options e Referrer-Policy sono impostati
  # una volta sola nel reverse proxy pubblico (`nginx/nginx.conf`), l'unico
  # server raggiungibile dall'esterno — questo container è su `expose`, rete
  # interna docker. Se un giorno servissero anche qui, ricorda che nginx NON
  # eredita gli `add_header` nei blocchi che ne hanno di propri: andrebbero
  # ripetuti in `location = /index.html` (il documento HTML della SPA, servito
  # da qui anche via fallback try_files).

  # SPA fallback
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Asset con hash → cache lunga
  location ~* \.(?:js|css|woff2|png|svg|webp)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # index.html e service worker → no cache
  location = /index.html { add_header Cache-Control "no-cache, no-store, must-revalidate"; }
  location = /sw.js { add_header Cache-Control "no-cache, no-store, must-revalidate"; }
  location = /registerSW.js { add_header Cache-Control "no-cache, no-store, must-revalidate"; }
  location = /manifest.webmanifest { add_header Cache-Control "no-cache"; }

  gzip on;
  gzip_types text/plain text/css application/json application/javascript application/wasm image/svg+xml;
}
