worker_processes auto;
events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  keepalive_timeout 65;
  client_max_body_size 25m;

  # Gzip
  gzip on;
  gzip_types text/plain text/css application/json application/javascript application/xml+rss text/xml application/wasm image/svg+xml;
  gzip_min_length 1024;

  upstream backend {
    server backend:3000;
  }

  upstream frontend {
    server frontend:80;
  }

  # ---------------------------------------------------------------
  # TLS-ready: in produzione monta i tuoi certificati e abilita il
  # blocco `server { listen 443 ssl }` qui sotto. Esempio Let's Encrypt:
  #   docker run -v ./certs:/etc/letsencrypt certbot/certbot certonly ...
  #
  # server {
  #   listen 443 ssl http2;
  #   server_name finance.example.com;
  #   ssl_certificate     /etc/nginx/certs/fullchain.pem;
  #   ssl_certificate_key /etc/nginx/certs/privkey.pem;
  #   ssl_protocols TLSv1.2 TLSv1.3;
  #   add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
  #   add_header X-Frame-Options DENY always;
  #   add_header X-Content-Type-Options nosniff always;
  #   add_header Referrer-Policy strict-origin-when-cross-origin always;
  #   # ... (stesso contenuto del server :80 sotto)
  # }
  # ---------------------------------------------------------------

  server {
    listen 80;
    server_name _;

    # API → backend NestJS
    location /api/ {
      proxy_pass http://backend/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      # SSE / streaming chat
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 600s;
      proxy_send_timeout 600s;
    }

    # Tutto il resto → frontend (SPA)
    location / {
      proxy_pass http://frontend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
